name: apply-flow-clock-trial

on:
  push:
    branches: [mirror/flow-clock-trial-20260914]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[flow-clock-trial-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: mirror/flow-clock-trial-20260914
          fetch-depth: 0

      - name: Apply bounded source patch
        run: python tools/apply_flow_clock_trial.py

      - name: Compile modified sources
        run: python -m compileall -q nodes.py flux_untwist

      - name: Commit bounded source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes.py flux_untwist/utils.py
          git commit -m "Implement Flow full-trajectory Untwist clock trial [flow-clock-trial-applied]"
          git push origin HEAD:mirror/flow-clock-trial-20260914
